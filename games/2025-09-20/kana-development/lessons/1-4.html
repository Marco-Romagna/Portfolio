<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>1-4 — Type Vowels (romaji)</title>
  <link rel="stylesheet" href="../../css/games/kana-development/lessons.css">
</head>
<body class="site">
  <main class="lesson" data-lesson-id="1-4" data-total-parts="3">
    <!-- Progress steps -->
    <header class="lesson-progress">
      <ol class="steps">
        <li class="step is-active" data-part="1">
          <span class="step-label">Part 1</span>
          <span class="step-sub">Preview</span>
        </li>
        <li class="step" data-part="2">
          <span class="step-label">Part 2</span>
          <span class="step-sub">Typing</span>
        </li>
        <li class="step" data-part="3">
          <span class="step-label">Part 3</span>
          <span class="step-sub">Finish</span>
        </li>
      </ol>
      <div class="progressbar"><div class="progressbar-fill"></div></div>
    </header>

    <!-- Part 1 -->
    <section id="part-1" class="lesson-part is-visible" data-part-index="1">
      <h2 class="part-title">Vowel Typing — Preview</h2>
      <div class="kana-grid">
        <div class="kana-card"><span class="kana-glyph">あ</span><div class="kana-sub">a</div></div>
        <div class="kana-card"><span class="kana-glyph">い</span><div class="kana-sub">i</div></div>
        <div class="kana-card"><span class="kana-glyph">う</span><div class="kana-sub">u</div></div>
        <div class="kana-card"><span class="kana-glyph">え</span><div class="kana-sub">e</div></div>
        <div class="kana-card"><span class="kana-glyph">お</span><div class="kana-sub">o</div></div>
      </div>
      <div class="actions">
        <button class="btn primary" data-action="advance">Start Typing</button>
      </div>
    </section>

    <!-- Part 2 -->
    <section id="part-2" class="lesson-part" data-part-index="2">
      <h2 class="part-title">Type the romaji</h2>
      <div class="type-panel">
        <div class="type-glyph-wrapper"></div>
        <input id="type-input" class="type-input" placeholder="Type romaji…" autocomplete="off" />
        <div class="quiz-progress">
          <div class="meter"><div class="meter-fill"></div></div>
          <div class="meter-label">Progress: 0 / 15</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn primary is-hidden" data-action="next-part">Next</button>
      </div>
    </section>

    <!-- Part 3 -->
    <section id="part-3" class="lesson-part" data-part-index="3">
      <h2 class="part-title">Well done!</h2>
      <p>You’ve completed vowel typing practice.</p>
      <div class="actions">
        <button class="btn primary" data-action="finish-lesson">Finish</button>
      </div>
    </section>

    <div class="lesson-cta is-hidden">
      <button class="btn primary" data-action="advance">Continue</button>
    </div>
  </main>
  <script src="../js/lessons/lessons.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>1-1 — Hiragana Vowels</title>

  <link rel="stylesheet" href="../../../../css/main.css">
  <link rel="stylesheet" href="../../../../css/games/kana-development/lessons.css">
</head>

<body class="site mode-light">
  <header class="header">
    <div class="container nav">
      <a class="brand" href="../index.html">
        <span class="dot"></span><span>Kana Development</span>
      </a>
    </div>
  </header>

  <main class="container game-wrap">
    <!-- INTRO -->
    <section class="stage" id="intro">
      <div class="card-big">
        <span class="kana-glyph">あ</span>
        <div class="kana-sub" id="kanaRomaji">a</div>
      </div>

      <p class="muted center">Tap a vowel.</p>

      <div class="choices choices-wide" id="vowelBtns">
        <button class="choice">あ</button>
        <button class="choice">い</button>
        <button class="choice">う</button>
        <button class="choice">え</button>
        <button class="choice">お</button>
      </div>

      <div class="footer-bar">
        <span>Level 1-1 — Hiragana Vowels</span>
        <button class="btn" id="nextBtn" type="button">Next</button>
      </div>
    </section>

    <!-- ACTIVITY (placeholder for now) -->
    <section class="stage" id="activity" hidden>
      <h3 class="center">1-1 Activity</h3>
      <p class="muted center">We’ll build this next. (This view replaced a page redirect.)</p>

      <div class="footer-bar">
        <button class="btn" id="backBtn" type="button">Back</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    © <span id="year"></span> Marco Romagna • All rights reserved
  </footer>

  <!-- Scripts -->
  <script src="../js/lesson-1-1.js"></script>
</body>
</html>

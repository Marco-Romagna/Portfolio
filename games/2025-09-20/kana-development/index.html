<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KanaDevelopment • Stages</title>

  <!-- Global site styles -->
  <link rel="stylesheet" href="../../../css/main.css">
  <!-- Tiny page styles (just to make text-thumbs look like icons) -->
  <link rel="stylesheet" href="../../../css/games/kana-development/styles.css">
</head>

<body class="site">
  <!-- Header -->
  <header class="header">
    <div class="container nav">
      <a class="brand" href="../../../index.html">
        <span class="dot"></span><span>Marco • Portfolio</span>
      </a>
      <nav class="links">
        <a class="cta" href="https://www.linkedin.com/in/marco-romagna" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main class="container">
    <!-- Summary -->
    <section class="panel">
      <h2>KanaDevelopment</h2>
      <p class="muted">
        Progress through <strong>Worlds</strong> (stages). Each world contains short, focused levels.
        Start with <strong>World&nbsp;1</strong> for vowel basics in hiragana and katakana.
      </p>
    </section>

    <!-- Worlds container -->
    <div id="worlds-root"></div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    © <span id="year"></span> Marco Romagna • All rights reserved
  </footer>

  <!-- Templates -->
  <template id="tpl-world">
    <section class="panel world">
      <h2 class="world-title"></h2>
      <p class="muted world-desc"></p>
      <ul class="card-grid levels-grid"></ul>
    </section>
  </template>

  <template id="tpl-level-card">
    <li class="card">
      <a class="card-thumb no-thumb">
        <span class="no-thumb-mark"></span>
      </a>
      <div class="card-body">
        <a class="card-title"></a>
        <div class="card-tags"></div>
        <p class="muted desc"></p>
      </div>
    </li>
  </template>

  <!-- Scripts (all external) -->
  <script src="js/stages.js"></script>
  <script src="js/render.js"></script>
  <script src="js/init.js"></script>
</body>
</html>

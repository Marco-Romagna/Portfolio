<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KanaDevelopment • Stages</title>

  <!-- Global site styles -->
  <link rel="stylesheet" href="../../../css/main.css">
</head>

<body class="site">
  <!-- Header -->
  <header class="header">
    <div class="container nav">
      <a class="brand" href="../../../index.html">
        <span class="dot"></span><span>Marco • Portfolio</span>
      </a>
      <nav class="links">
        <a class="cta" href="https://www.linkedin.com/in/marco-romagna" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main class="container">
    <!-- Summary -->
    <section class="panel">
      <h2>KanaDevelopment</h2>
      <p class="muted">
        Progress through <strong>Worlds</strong> (stages). Each world contains several short levels. 
        Start with <strong>World&nbsp;1</strong> to learn the vowel sounds in hiragana and katakana.
      </p>
    </section>

    <!-- Worlds container -->
    <div id="worlds-root"></div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    © <span id="year"></span> Marco Romagna • All rights reserved
  </footer>

  <!-- Templates -->
  <template id="tpl-world">
    <section class="panel world">
      <h2 class="world-title"></h2>
      <p class="muted world-desc"></p>
      <ul class="card-grid levels-grid"></ul>
    </section>
  </template>

  <template id="tpl-level-card">
    <li class="card">
      <a class="card-thumb no-thumb">
        <span class="no-thumb-mark"></span>
      </a>
      <div class="card-body">
        <a class="card-title"></a>
        <div class="card-tags"></div>
        <p class="muted desc"></p>
      </div>
    </li>
  </template>

  <!-- Data -->
  <script src="js/stages.js"></script>

  <!-- Render logic -->
  <script>
    function renderWorlds(worlds) {
      const root = document.getElementById("worlds-root");
      const worldTpl = document.getElementById("tpl-world");
      const levelTpl = document.getElementById("tpl-level-card");
      root.innerHTML = "";

      worlds.forEach(w => {
        const wNode = worldTpl.content.cloneNode(true);
        wNode.querySelector(".world-title").textContent = w.title;
        wNode.querySelector(".world-desc").textContent = w.desc;

        const grid = wNode.querySelector(".levels-grid");
        w.levels.forEach(lv => {
          const lNode = levelTpl.content.cloneNode(true);

          const thumb = lNode.querySelector(".card-thumb");
          thumb.href = lv.href;
          lNode.querySelector(".no-thumb-mark").textContent = lv.code;

          const title = lNode.querySelector(".card-title");
          title.href = lv.href;
          title.textContent = lv.title;

          const tags = lNode.querySelector(".card-tags");
          (lv.tags || []).forEach(t => {
            const span = document.createElement("span");
            span.className = "tag";
            span.textContent = t;
            tags.appendChild(span);
          });

          lNode.querySelector(".desc").textContent = lv.desc;
          grid.appendChild(lNode);
        });

        root.appendChild(wNode);
      });
    }

    // Boot
    (function init() {
      document.getElementById("year").textContent = new Date().getFullYear();

      const { worlds, levels } = window.KANA_STAGES;
      const levelIndex = Object.fromEntries(levels.map(l => [l.code, l]));
      const merged = worlds.map(w => ({
        ...w,
        levels: w.levels.map(code => levelIndex[code]).filter(Boolean)
      }));

      renderWorlds(merged);
    })();
  </script>
</body>
</html>

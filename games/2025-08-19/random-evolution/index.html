<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Random Evolution • Game</title>
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" href="data:,">

  <!-- Site styles -->
  <link rel="stylesheet" href="../../../css/main.css">
  <!-- Game styles -->
  <link rel="stylesheet" href="../../../css/games/random-evolution/styles.css?v=revo3">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container nav">
      <a class="brand" href="../../../index.html">
        <span class="dot"></span><span>Marco • Portfolio</span>
      </a>
      <nav class="links">
        <a class="cta" href="https://www.linkedin.com/in/marco-romagna" target="_blank" rel="noopener">LinkedIn</a>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main class="container">
    <section class="panel">
      <h2 class="panel-title" id="game-title">Random Evolution</h2>

      <!-- HUD -->
      <div class="revo-hud inactive" id="hud">
        <div class="hud-pill">
          <span class="label">Score</span>
          <span id="hud-score" class="value mono">0</span>
        </div>
        <div class="hud-pill">
          <span class="label">Mult</span>
          <span id="hud-mult" class="value mono">x1</span>
        </div>
        <div class="hud-pill">
          <span class="label">Lives</span>
          <span id="hud-lives" class="value mono">3</span>
        </div>
      </div>

      <!-- Stage wrapper: LEFT rail + STAGE + RIGHT history -->
      <div class="revo-stage-wrap rails-hidden">
        <!-- Pokédex rail (left) -->
        <div id="pokedex-rail" class="pokedex-rail" aria-hidden="true">
          <div class="rail-track">
            <div class="rail-fill"></div>
            <!-- generation dividers injected via JS -->
          </div>
          <div class="rail-needle">
            <span class="needle-line"></span>
            <span class="needle-label">#—</span>
          </div>
        </div>

        <!-- Stage -->
        <div id="stage" class="revo-stage">
          <!-- Gen badge now lives INSIDE the stage -->
          <div id="gen-badge" class="stage-gen-badge" aria-hidden="true"></div>

          <div id="aim" class="revo-aim" aria-hidden="true">Higher than —</div>

          <!-- Pokémon art -->
          <img id="imgA" class="revo-img" alt="Current Pokémon">
          <img id="imgB" class="revo-img" alt="Next Pokémon">

          <div id="flash" class="revo-flash"></div>
          <div id="timer" class="revo-timer">—</div>

          <!-- Start Overlay (inside .revo-stage) -->
          <div id="start-screen" class="start-overlay">
            <button class="btn-close" type="button" aria-label="Close" hidden></button>

            <h2 class="start-title">Choose your difficulty</h2>

            <p class="start-rules">
              Press <strong>A</strong> to advance when the Dex number is higher or lower,
              or <strong>B</strong> to cancel the evolution if it isn’t.
            </p>

            <!-- NEW: diff-stack wrapper -->
            <div class="start-actions diff-stack">
              <button class="mode-btn" data-mode="easy"   type="button">Easy</button>
              <button class="mode-btn" data-mode="medium" type="button">Medium</button>
              <button class="mode-btn" data-mode="hard"   type="button">Hard</button>
            </div>
          </div>

          <!-- End overlay -->
          <div id="end-screen" class="revo-end hidden">
            <h3 class="title">Game Over</h3>
            <p class="subtitle">Final score: <span id="final-score">0</span></p>
            <div class="btn-row">
              <button id="play-again" class="mode-btn">Play Again</button>
            </div>
          </div>

          <!-- Buttons in-stage -->
          <div id="controls" class="ab-instage hidden">
            <img id="a-button" src="./assets/buttons/A_Confirm_button.png" alt="A Confirm">
            <img id="b-button" src="./assets/buttons/B_Decline_button.png" alt="B Decline">
          </div>

          <img
            id="evolve-button"
            class="evolve-img hidden"
            src="./assets/buttons/Evolve_button.png"
            alt="Evolve">
        </div>

        <!-- Controls dock (used in mobile landscape) -->
        <div id="controls-dock" class="controls-dock" aria-hidden="true">
          <h2 id="dock-start-title" class="dock-start-title" hidden></h2>
        </div>

        <!-- History rail (right) -->
        <aside id="revo-history" class="revo-history" aria-label="Encounter history" aria-hidden="true">
          <div class="history-track" id="history-track"></div>
        </aside>
      </div>

      <!-- Volume row -->
      <div class="revo-audio">
        <span class="tag">Sound</span>
        <!-- JS injects mute + volume -->
      </div>
    </section>
  </main>

  <!-- JS modules -->
  <script src="./js/modules/util.js" defer></script>
  <script src="./js/modules/audio.js" defer></script>
  <script src="./js/modules/dom.js" defer></script>
  <script src="./js/modules/rail.js" defer></script>
  <script src="./js/modules/hud.js" defer></script>
  <script src="./js/modules/history.js" defer></script>
  <script src="./js/modules/game.js" defer></script>
  <script src="./js/random-evolution.js" defer></script>
</body>
</html>

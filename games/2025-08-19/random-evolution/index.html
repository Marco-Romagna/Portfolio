<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Random Evolution • Game</title>
  <meta name="color-scheme" content="dark light" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container nav">
      <a class="brand" href="#">
        <span class="dot"></span><span>Random Evolution</span>
      </a>
      <nav class="links">
        <a class="cta" href="#">LinkedIn</a>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main class="container revo-stage-wrap">
    <!-- Rail -->
    <div class="pokedex-rail">
      <div class="rail-track">
        <div class="rail-fill"></div>
      </div>
      <div class="rail-needle">
        <div class="needle-line"></div>
        <div class="needle-label"></div>
      </div>
    </div>

    <!-- Stage (Pokemon image etc.) -->
    <section class="panel revo-stage">
      <h2 id="status">Decide if the next Pokémon’s Pokédex number is higher or lower!</h2>
      <div id="pokemon-image" class="pokemon-img"></div>
      <div class="buttons">
        <button id="btn-lower">A</button>
        <button id="btn-higher">B</button>
      </div>
    </section>
  </main>

  <script src="random-evolution.js"></script>
</body>
</html>

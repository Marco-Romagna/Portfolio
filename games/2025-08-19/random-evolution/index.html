<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Random Evolution • Game</title>
  <meta name="color-scheme" content="dark light" />
  <!-- Main portfolio styles -->
  <link rel="stylesheet" href="../../../css/main.css">
  <!-- Game-specific styles -->
  <link rel="stylesheet" href="../../../css/games/random-evolution/styles.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container nav">
      <!-- Brand -->
      <a class="brand" href="../../../index.html">
        <span class="dot"></span><span>Marco • Portfolio</span>
      </a>
      <!-- Nav -->
      <nav class="links">
        <a class="cta" href="https://www.linkedin.com/in/marco-romagna" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main class="container">
    <section class="panel">
      <h2>Random Evolution</h2>
      <p>Higher / Lower reflex game using the evolution animation.</p>

      <!-- HUD -->
      <div id="hud" class="revo-hud">
        <div class="hud-left">
          <span class="tag">Current</span>
          <span id="hud-current" class="mono">#—</span>
        </div>
        <div class="hud-center">
          <span class="tag">Aim</span>
          <span id="hud-rule" class="rule">Higher</span>
        </div>
        <div class="hud-right">
          <span class="tag">Score</span>
          <span id="hud-score" class="mono">0</span>
          <span class="sep">•</span>
          <span class="tag">Mult</span>
          <span id="hud-mult" class="mono">x1</span>
          <span class="sep">•</span>
          <span class="tag">Lives</span>
          <span id="hud-lives" class="mono">3</span>
        </div>
      </div>

      <!-- Stage -->
      <div id="stage" class="revo-stage">
        <img id="imgA" class="revo-img" alt="Current form">
        <img id="imgB" class="revo-img" alt="Next form">
        <div id="flash" class="revo-flash"></div>
      </div>

      <!-- Controls -->
      <div id="controls">
        <img id="a-button" src="assets/buttons/A_button.png" alt="A Button">
        <img id="b-button" src="assets/buttons/B_button.png" alt="B Button">
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="js/random-evolution.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Random Evolution • Game</title>
  <meta name="color-scheme" content="dark light" />
  <link rel="stylesheet" href="../../../css/main.css">
  <link rel="stylesheet" href="../../../css/games/random-evolution/styles.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container nav">
      <a class="brand" href="../../../index.html">
        <span class="dot"></span><span>Marco • Portfolio</span>
      </a>
      <nav class="links">
        <a class="cta" href="https://www.linkedin.com/in/marco-romagna" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main class="container">
    <section class="panel">
      <h2>Random Evolution</h2>
      <div class="game-container">
        
        <!-- Left sidebar for Gens -->
        <aside class="gens">
          <button>G9</button>
          <button>G8</button>
          <button>G7</button>
          <button>G6</button>
          <button>G5</button>
          <button>G4</button>
          <button>G3</button>
          <button class="active">G2</button>
          <button>G1</button>
        </aside>

        <!-- Game stage -->
        <div id="stage" class="revo-stage">
          <div id="overlay" class="overlay">
            <h2>Do you know your Pokédex numbers?</h2>
            <p class="subtext">Choose your difficulty to begin.</p>
            <div class="difficulty">
              <button class="easy">Easy</button>
              <button class="medium">Medium</button>
              <button class="hard">Hard</button>
            </div>
          </div>

          <!-- Pokémon display -->
          <div id="pokemon" class="pokemon hidden">
            <img id="poke-img" alt="Pokémon">
            <div id="dex-number"></div>
          </div>

          <!-- A/B controls inside stage -->
          <div id="controls" class="ab-instage hidden">
            <img id="b-button" src="../../../assets/buttons/B_button.png" alt="B Button">
            <img id="a-button" src="../../../assets/buttons/A_button.png" alt="A Button">
          </div>
        </div>
      </div>

      <!-- Sound control -->
      <div class="sound-control">
        <label for="sound">Sound</label>
        <button id="sound-toggle">🔇</button>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5">
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="../../../js/games/random-evolution/game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cannon Fodder • Marco Portfolio</title>
  <meta name="color-scheme" content="dark light" />

  <!-- Styles -->
  <link rel="stylesheet" href="../../../css/main.css">
  <script src="../../../no-mobile.js" defer></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    main.container {
      padding: 0; /* remove extra padding around iframe */
    }

    .pdf-viewer {
      width: 100%;
      height: calc(100vh - 120px); 
      /* 100vh = full viewport height
         subtract ~120px for header + footer */
      border: none;
      display: block;
    }
  </style>
</head>
<body class="site">
  <!-- Header -->
  <header class="header">
    <div class="container nav">
      <a class="brand" href="../../../index.html">
        <span class="dot"></span><span>Marco • Portfolio</span>
      </a>
      <nav class="links">
        <a class="cta" href="https://www.linkedin.com/in/marco-romagna"
           target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main class="container">
    <section class="panel">
      <h2>Cannon Fodder Rulebook</h2>
      <iframe class="pdf-viewer" src="CannonFodder.pdf"></iframe>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer container">
    <p>&copy; 2025 Marco Romagna</p>
  </footer>
</body>
</html>

<!-- Unity WebGL placeholder -->
<div class="unity-wrap">
  <div class="unity-loading" id="loader">
    <div class="logo">Made with <span>Unity</span></div>
    <div class="bar"><div class="fill" id="barFill"></div></div>
    <div class="pct" id="pct">0%</div>
    <div class="hint">Preparing placeholder…</div>
  </div>

  <div class="unity-placeholder" id="placeholder">
    <div class="ph-content">
      <div class="ph-title">WebGL demo placeholder</div>
      <p>The lobby WebGL build will load here.</p>
    </div>
  </div>
</div>

<script>
  // Fake loader animation
  (function () {
    const bar = document.getElementById('barFill');
    const pct = document.getElementById('pct');
    const loader = document.getElementById('loader');
    const placeholder = document.getElementById('placeholder');

    placeholder.style.display = 'none'; // hide until finished
    let p = 0;
    const tick = () => {
      p += Math.max(0.5, (100 - p) * 0.05);
      if (p > 100) p = 100;
      bar.style.width = p.toFixed(0) + '%';
      pct.textContent = p.toFixed(0) + '%';
      if (p < 100) {
        requestAnimationFrame(tick);
      } else {
        setTimeout(() => {
          loader.style.opacity = '0';
          loader.addEventListener('transitionend', () => {
            loader.hidden = true;
            placeholder.style.display = 'grid'; // reveal after loading
          }, { once: true });
        }, 300);
      }
    };
    requestAnimationFrame(tick);
  })();
</script>
